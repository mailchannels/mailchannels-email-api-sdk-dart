name: Dart SDK validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dart: ['3.11.0', '3.12.0', '3.13.1']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install cryptography==45.0.3
      - run: bash scripts/test.sh
        env:
          DART_VERSION: ${{ matrix.dart }}
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.3
      - run: bash scripts/regenerate.sh && git diff --exit-code
      - run: bash scripts/pack.sh
      - run: python scripts/audit.py pubspec.lock .work/audit.json
      - run: |
          source scripts/common.sh
          docker run "${args[@]}" "$image" dart --suppress-analytics pub publish --dry-run
